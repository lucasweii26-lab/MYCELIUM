[[headers]]
  for = "/hero-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/hero-frames-large/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/hero-wire/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  function = "mycelium-country"
  path = "/"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/my/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/us/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200
